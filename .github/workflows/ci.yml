name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.88.0 --profile minimal --component clippy --component rustfmt --component llvm-tools
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap xvfb libkrb5-dev libx11-dev libxkbfile-dev libsecret-1-dev
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Lint, format, type-check, and validate Rust
        run: pnpm check
      - name: Test
        run: xvfb-run -a pnpm test
